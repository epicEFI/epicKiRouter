name: rust-check

on:
  push:
    branches: [master, main, epic/main]
    paths: ["rust/**", ".github/workflows/rust-check.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Suite BARE (T17b): the buglog-175 watchdog bounds the
      # `detail_pass_restores_...` sentinel (its world-2 route fires a
      # 10s wall deadline; bm01's detail pass alone is >50 min in this
      # build), so the T17a skip protocol is RETIRED — the bare suite
      # is the gate again. timeout-minutes still bounds any other
      # unbounded test (a hang trips here instead of the 360-min job
      # default).
      - run: cargo test --workspace
        timeout-minutes: 30
      # corpus compare is java-free (reads only the committed goldens);
      # EPIC_SKIP_GRADLE guards against future oracle coupling.
      - run: cargo run -q -p epic-harness -- corpus compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M1b parse parity: all 1,332 digest+soak fixtures (175 + 1,157) vs
      # the committed Java-oracle goldens; the divergence ledger is
      # retired/empty since D22 (normalizeAllTraces landed in T13).
      - run: cargo run -q -p epic-harness -- dsn compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M1b SES emission parity: tier A+B (20 fixtures) vs the committed
      # session goldens — byte-equal expected (byte-diff classifier for
      # anything else).
      - run: cargo run -q -p epic-harness -- dsn ses-compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M2 T15 endpoint-snap parity: the contacts-wired writer over the 5
      # ROUTED fixtures vs committed goldens + Java-side counter sidecar
      # (provider gate, snapFired=0 canary) — java-free compare.
      - run: cargo run -q -p epic-harness -- dsn ses-snap-compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M2 index parity: tree dumps + query replay vs committed Java-oracle
      # goldens (tier fixtures + stressors) — java-free compare.
      - run: cargo run -q -p epic-harness -- index compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M2 snapshot/undo parity: scripted snapshot/insert/remove/undo/redo/
      # pop replay vs committed Java-oracle goldens — java-free compare.
      - run: cargo run -q -p epic-harness -- undo compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T2 DRC parity: incompletes (filter → grouping → Delaunay →
      # Kruskal airline count, per-net rows, maxConnections) + clearance
      # violations over 17 fixtures (11 tier A + 3 PCBench pre-routed + 3
      # craft pin boards) vs committed DrcOracle goldens — java-free.
      - run: cargo run -q -p epic-harness -- drc compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T15 router quality scoreboard: epic-cli must exist for the
      # two steps below (the harness resolves target/debug/epic-cli).
      # Step bounds (quality-review MINOR-1): 5 min ≈ a cold `cargo
      # build -q -p epic-cli` with headroom (warm cache: seconds).
      - run: cargo build -q -p epic-cli
        timeout-minutes: 5
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T15 determinism self-gate: same DSN, two epic-cli runs to
      # separate output paths, byte-identical SES + manifest (java-free,
      # ~1s on the smallest Tier A board). HARD gate: any divergence is a
      # real determinism bug and fails CI. Step bound: 30 min = 7.5x the
      # worst case (two runs x the 120s tiers timeout) — a hang trips
      # here instead of the 360-min job default.
      - run: cargo run -q -p epic-harness -- router determinism
        timeout-minutes: 30
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T15 router compare (REPORT mode — every fixture gets an
      # explicit verdict in the CI log, exit stays 0). This step runs
      # the ROUTER-ONLY profile (the default; fanout-off epic-cli vs
      # the committed router-only records) — green since M4-T6 (11/0 in
      # 337.7s, logs/M4-T6/evidence/cmp_router_t6.log). The exit flip is
      # judged on the MILESTONE battery — the full-profile face
      # M6-T3 ADJUDICATION (2026-09-26; logs/M6-T3/report-t3.md):
      # NO-GO (honest hold) — the third consecutive hold, BOTH
      # preconditions failing:
      # Precondition 1 — Tier A completion: FAIL on the harness verdict
      # face (10 green / 1 red — DAC2020_bm01 killed at the 1800.2 s
      # tier bound on the INTEGRITY gate: harness timeout, no manifest,
      # exit None; NOT a completion failure — pre-kill router face
      # 0-unrouted / 1000.00, optimizer pass #1 571.93 s REJECTED
      # OPTIMIZER_SCORE_NOT_IMPROVED, incumbent restored), while the
      # completion-only reading PASSES it (11/11 — every router reached
      # 0 unrouted; incompletes <= Java and violations <= Java on all
      # ten completers). BOTH faces are named explicitly because the
      # flip precondition is judged on both: the verdict face must read
      # 11 green / 0 red AND the completion face 11/11 (the plan's
      # earlier "expect 11/11" wording was self-contradictory — spec
      # review PLAN-LEVEL finding 1; this durable record does not
      # repeat that ambiguity).
      # Precondition 2 — Sigma Tier A < the 30-min budget: FAIL.
      # Sigma Tier A (measured, full flow, default settings) =
      # 2089.5 s = 34.8 min > this step's timeout-minutes: 30
      # (= 1800 s) — over by 289.5 s = 16.1%. Either failing implies
      # NO-GO; both fail.
      # REOPEN BOUND: the other ten Tier A walls sum 289.3 s (4.8 min),
      # so the flip reopens exactly when bm01's total completes
      # < 1510.7 s (today: ~276 s routing + 571.9 s rejected optimizer
      # P1 + P2 to the kill — roughly a 2x per-pass optimizer drop fits
      # two full passes under the remaining budget). Named lever,
      # RECORDED NOT ATTEMPTED: deterministic candidate parallelism
      # (buglog 197; Java DefaultSettings.java:182
      # optimizer.maxThreads = cores-1 vs Rust's mandated 1-thread
      # face; the M5-T7 partition pattern).
      # BOUND-RISE ADJUDICATED: NOT TAKEN. The earlier wording ("the
      # wall to drop ... or this bound to rise") is retired as policy:
      # the wall drops, the bound does not rise — bounds are never
      # raised to fit walls (the same discipline as tiers.yaml
      # timeouts).
      # RESIDUALS (short form; the full ledger lives in rust/README's
      # CI-posture comment): the B/C completion reds are the T8/T9
      # tuning population (bm05 29v18, interf_u 1v0, 1Bitsy 2v1,
      # bm04 3v2); kill faces bm01 (A) + bm10/StickHub/LimeSDR (B/C);
      # the FANOUT-FULL-FLOW GATE GAP — the events fixtures are capture
      # replays that never exercise the changed fanout arm and the
      # router-only/ses/det gates run fanout-disabled, so the
      # buglog-181 fix carries zero byte-invariance coverage until a
      # fanout-full-flow golden exists (guards: the ci_tripwire pins +
      # sanctioned faces + the batteries); the Sigma-decomposition
      # battery print and the quality-r2 NITs are BANKED for the first
      # harness touch.
      # PROTOCOL AT THE FLIP (unchanged): drop `--report-only` here,
      # update BOTH ci_tripwire.rs pins in the SAME commit, add the
      # events-compare step (java-free, green since M4-T6) with its own
      # pin, and refresh the posture prose (rust/README status block +
      # gates comment, design §6 CI paragraph, SEAM posture rows).
      # THREADS-GATE CI WIRING: still RE-DEFERRED (the M5-T8 decision
      # (2)), now WITH CAUSE — it lands WITH the flip commit; the
      # cause of the continued deferral is that the flip preconditions
      # failed at M6-T3. The in-tree threads-invariance gate (bm06
      # byte-identical across -mt 1/3/4) stays pinned in-tree only.
      # WALL WARNING: the battery's wall is the SUM of tier timeouts;
      # a full-battery push trips this 30-min step bound (the designed
      # tripwire for the wall), and a harness-KILLED run skips the
      # detail pass outright (an in-process re-run of a wall-truncated
      # board would only re-burn the same wall). Release-profile routing
      # is ~10x faster than debug with byte-identical outcomes (T17b
      # witnessed: bm01 pass #1 debug 1074s vs release 103s, same score
      # 466.67 / 78 unrouted / 0 violations); the spawned epic-cli
      # prefers a release bin (the bug-184 freshness guard), but a
      # cacheless CI checkout can still adopt a debug sibling. Retiring
      # the trip needs the wall to drop — the bound does not rise (the
      # M6-T4 adjudication above).
      - run: cargo run -q -p epic-harness -- router compare --report-only
        timeout-minutes: 30
        env:
          EPIC_SKIP_GRADLE: "1"
