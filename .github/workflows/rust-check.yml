name: rust-check

on:
  push:
    branches: [master, main, epic/main]
    paths: ["rust/**", ".github/workflows/rust-check.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # corpus compare is java-free (reads only the committed goldens);
      # EPIC_SKIP_GRADLE guards against future oracle coupling.
      - run: cargo run -q -p epic-harness -- corpus compare
        env:
          EPIC_SKIP_GRADLE: "1"
