name: rust-check

on:
  push:
    branches: [master, main, epic/main]
    paths: ["rust/**", ".github/workflows/rust-check.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Suite BARE (T17b): the buglog-175 watchdog bounds the
      # `detail_pass_restores_...` sentinel (its world-2 route fires a
      # 10s wall deadline; bm01's detail pass alone is >50 min in this
      # build), so the T17a skip protocol is RETIRED — the bare suite
      # is the gate again. timeout-minutes still bounds any other
      # unbounded test (a hang trips here instead of the 360-min job
      # default).
      - run: cargo test --workspace
        timeout-minutes: 30
      # corpus compare is java-free (reads only the committed goldens);
      # EPIC_SKIP_GRADLE guards against future oracle coupling.
      - run: cargo run -q -p epic-harness -- corpus compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M1b parse parity: all 1,332 digest+soak fixtures (175 + 1,157) vs
      # the committed Java-oracle goldens; the divergence ledger is
      # retired/empty since D22 (normalizeAllTraces landed in T13).
      - run: cargo run -q -p epic-harness -- dsn compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M1b SES emission parity: tier A+B (20 fixtures) vs the committed
      # session goldens — byte-equal expected (byte-diff classifier for
      # anything else).
      - run: cargo run -q -p epic-harness -- dsn ses-compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M2 T15 endpoint-snap parity: the contacts-wired writer over the 5
      # ROUTED fixtures vs committed goldens + Java-side counter sidecar
      # (provider gate, snapFired=0 canary) — java-free compare.
      - run: cargo run -q -p epic-harness -- dsn ses-snap-compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M2 index parity: tree dumps + query replay vs committed Java-oracle
      # goldens (tier fixtures + stressors) — java-free compare.
      - run: cargo run -q -p epic-harness -- index compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M2 snapshot/undo parity: scripted snapshot/insert/remove/undo/redo/
      # pop replay vs committed Java-oracle goldens — java-free compare.
      - run: cargo run -q -p epic-harness -- undo compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T2 DRC parity: incompletes (filter → grouping → Delaunay →
      # Kruskal airline count, per-net rows, maxConnections) + clearance
      # violations over 17 fixtures (11 tier A + 3 PCBench pre-routed + 3
      # craft pin boards) vs committed DrcOracle goldens — java-free.
      - run: cargo run -q -p epic-harness -- drc compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T15 router quality scoreboard: epic-cli must exist for the
      # two steps below (the harness resolves target/debug/epic-cli).
      # Step bounds (quality-review MINOR-1): 5 min ≈ a cold `cargo
      # build -q -p epic-cli` with headroom (warm cache: seconds).
      - run: cargo build -q -p epic-cli
        timeout-minutes: 5
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T15 determinism self-gate: same DSN, two epic-cli runs to
      # separate output paths, byte-identical SES + manifest (java-free,
      # ~1s on the smallest Tier A board). HARD gate: any divergence is a
      # real determinism bug and fails CI. Step bound: 30 min = 7.5x the
      # worst case (two runs x the 120s tiers timeout) — a hang trips
      # here instead of the 360-min job default.
      - run: cargo run -q -p epic-harness -- router determinism
        timeout-minutes: 30
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T15 router compare: full 11-fixture Tier A battery (fanout-off
      # epic-cli runs vs the committed router-only Java records), REPORT
      # mode — every fixture gets an explicit verdict in the CI log, but
      # exit stays 0. Landed green ON PURPOSE: the T17a integrity close
      # fixed both panic classes (buglog 169/170 closed); the battery now
      # reads 5 green / 1 quality-red (ecc83-pp_v2, buglog 176) /
      # 5 timeout-integrity-red (bm01/bm06/bm11/pic_programmer/sonde,
      # buglog 175; sonde also carries the new buglog-177 panic class).
      # THE EXIT-CONDITION FLIP: drop `--report-only` from this line
      # once every Tier A fixture passes all three directional gates
      # (incomplete <= Java, violations <= Java, score >= Java − 2%).
      # WALL WARNING (refreshed post-T17a, quality-review T17a-2 Q-2):
      # the wall ROSE, it did not drop — bm01's subprocess alone burns
      # its full 1800s tier timeout (pass #1 measured 1074s vs Java's
      # 106s total) and every red fixture additionally burns an
      # UNBOUNDED in-process detail pass (bm01 >50 min observed), so a
      # full-battery push WILL trip this 30-min step bound until the
      # buglog-175 watchdog lands (wall-clock deadline in the driver
      # loop or thread + channel timeout); until then this step is the
      # CI tripwire for that wall, by design.
      - run: cargo run -q -p epic-harness -- router compare --report-only
        timeout-minutes: 30
        env:
          EPIC_SKIP_GRADLE: "1"
