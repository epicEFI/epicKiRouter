name: rust-check

on:
  push:
    branches: [master, main, epic/main]
    paths: ["rust/**", ".github/workflows/rust-check.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Suite BARE (T17b): the buglog-175 watchdog bounds the
      # `detail_pass_restores_...` sentinel (its world-2 route fires a
      # 10s wall deadline; bm01's detail pass alone is >50 min in this
      # build), so the T17a skip protocol is RETIRED — the bare suite
      # is the gate again. timeout-minutes still bounds any other
      # unbounded test (a hang trips here instead of the 360-min job
      # default).
      - run: cargo test --workspace
        timeout-minutes: 30
      # corpus compare is java-free (reads only the committed goldens);
      # EPIC_SKIP_GRADLE guards against future oracle coupling.
      - run: cargo run -q -p epic-harness -- corpus compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M1b parse parity: all 1,332 digest+soak fixtures (175 + 1,157) vs
      # the committed Java-oracle goldens; the divergence ledger is
      # retired/empty since D22 (normalizeAllTraces landed in T13).
      - run: cargo run -q -p epic-harness -- dsn compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M1b SES emission parity: tier A+B (20 fixtures) vs the committed
      # session goldens — byte-equal expected (byte-diff classifier for
      # anything else).
      - run: cargo run -q -p epic-harness -- dsn ses-compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M2 T15 endpoint-snap parity: the contacts-wired writer over the 5
      # ROUTED fixtures vs committed goldens + Java-side counter sidecar
      # (provider gate, snapFired=0 canary) — java-free compare.
      - run: cargo run -q -p epic-harness -- dsn ses-snap-compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M2 index parity: tree dumps + query replay vs committed Java-oracle
      # goldens (tier fixtures + stressors) — java-free compare.
      - run: cargo run -q -p epic-harness -- index compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M2 snapshot/undo parity: scripted snapshot/insert/remove/undo/redo/
      # pop replay vs committed Java-oracle goldens — java-free compare.
      - run: cargo run -q -p epic-harness -- undo compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T2 DRC parity: incompletes (filter → grouping → Delaunay →
      # Kruskal airline count, per-net rows, maxConnections) + clearance
      # violations over 17 fixtures (11 tier A + 3 PCBench pre-routed + 3
      # craft pin boards) vs committed DrcOracle goldens — java-free.
      - run: cargo run -q -p epic-harness -- drc compare
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T15 router quality scoreboard: epic-cli must exist for the
      # two steps below (the harness resolves target/debug/epic-cli).
      # Step bounds (quality-review MINOR-1): 5 min ≈ a cold `cargo
      # build -q -p epic-cli` with headroom (warm cache: seconds).
      - run: cargo build -q -p epic-cli
        timeout-minutes: 5
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T15 determinism self-gate: same DSN, two epic-cli runs to
      # separate output paths, byte-identical SES + manifest (java-free,
      # ~1s on the smallest Tier A board). HARD gate: any divergence is a
      # real determinism bug and fails CI. Step bound: 30 min = 7.5x the
      # worst case (two runs x the 120s tiers timeout) — a hang trips
      # here instead of the 360-min job default.
      - run: cargo run -q -p epic-harness -- router determinism
        timeout-minutes: 30
        env:
          EPIC_SKIP_GRADLE: "1"
      # M3 T15 router compare (REPORT mode — every fixture gets an
      # explicit verdict in the CI log, exit stays 0). This step runs
      # the ROUTER-ONLY profile (the default; fanout-off epic-cli vs
      # the committed router-only records) — green since M4-T6 (11/0 in
      # 337.7s, logs/M4-T6/evidence/cmp_router_t6.log). The exit flip is
      # judged on the MILESTONE battery — the full-profile face
      # (fanout + router + optimizer vs the M0 full-flow records), which
      # reads 8 PASS / 3 RED (logs/M5-T8/evidence/battery_full_t8.log).
      # The M5-T8 close recorded the flip HELD for a second consecutive
      # milestone, with the failure COMPOSITION changed: the maze-search
      # wall collapsed (bm01 routing now COMPLETES 0/0/1000.00 in ~276s
      # vs M4's kill-at-plateau 668.8s; bm11 600.2s -> 197.7s; bm06
      # 80.0s -> 25.0s), but bm01 is now killed at the 1800s optimizer
      # tier on a NON-improvable 0.00-score incumbent (the T1b-parity-
      # corrected optimizer stage is the binding face; routing itself
      # is complete — not a search regression), and bm06 3>2 / bm11 4>3
      # are the buglog-181 completion residuals (owner M6).
      # Preconditions, both unmet: battery 8/11 != 11/11; suite wall
      # 2286.1s harness-elapsed (~38.1 min) exceeds this 30-min bound
      # and reads 2.02x Σ-Java (1130.39s vs the <=0.5x target of
      # 565.19s; like-for-like per-fixture excl-bm01: 256.7s = 2.42x —
      # both bases labeled per the T8 report). Next-flip precondition
      # (M6): the wall work — the bm01 optimizer-entry question (re-read
      # Java's preflight guard) + the 1800s tier bound + the bm06/bm11
      # completion levers (buglog 181) — until the full battery reads
      # 11/11 AND its wall fits this budget. Then: drop `--report-only`
      # here, update BOTH ci_tripwire.rs pins in the SAME commit, add
      # the events-compare step (java-free, green since M4-T6) with its
      # own pin, and refresh the posture prose (rust/README status block
      # + gates comment, design §6 CI paragraph). The in-tree
      # threads-invariance gate (bm06 byte-identical across -mt 1/3/4)
      # stays pinned in-tree only; its CI wiring is RE-DEFERRED to the
      # same M6 flip-adjacent moment (the T9 decision).
      # WALL WARNING: the battery's wall is the SUM of tier timeouts;
      # a full-battery push trips this 30-min step bound (the designed
      # tripwire for the wall), and a harness-KILLED run skips the
      # detail pass outright (an in-process re-run of a wall-truncated
      # board would only re-burn the same wall). Release-profile routing
      # is ~10x faster than debug with byte-identical outcomes (T17b
      # witnessed: bm01 pass #1 debug 1074s vs release 103s, same score
      # 466.67 / 78 unrouted / 0 violations); the spawned epic-cli
      # prefers a release bin (the bug-184 freshness guard), but a
      # cacheless CI checkout can still adopt a debug sibling. Retiring
      # the trip needs the wall to drop (the M6 wall work described
      # above) or this bound to rise.
      - run: cargo run -q -p epic-harness -- router compare --report-only
        timeout-minutes: 30
        env:
          EPIC_SKIP_GRADLE: "1"
