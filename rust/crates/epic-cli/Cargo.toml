[package]
name = "epic-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "epic-cli"
path = "src/main.rs"

[dependencies]
epic-board = { path = "../epic-board" }
epic-dsn = { path = "../epic-dsn" }
epic-geometry = { path = "../epic-geometry" }
epic-router = { path = "../epic-router" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
num-bigint = "0.4"

[lints]
workspace = true
