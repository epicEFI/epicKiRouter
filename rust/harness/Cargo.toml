[package]
name = "epic-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "epic-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
epic-board = { path = "../crates/epic-board" }
epic-dsn = { path = "../crates/epic-dsn" }
epic-geometry = { path = "../crates/epic-geometry" }
epic-index = { path = "../crates/epic-index" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9" # maintained drop-in fork of the archived serde_yaml (RUSTSEC-2024-0320); API-identical
sha2 = "0.10"

[lints]
workspace = true
