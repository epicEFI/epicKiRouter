[workspace]
resolver = "3"
members = [
    "crates/epic-geometry",
    "crates/epic-dsn",
    "crates/epic-board",
    "crates/epic-index",
    "crates/epic-drc",
    "crates/epic-router",
    "crates/epic-engine",
    "crates/epic-cli",
    "crates/epic-gui",
    "harness",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.93"

[workspace.lints.rust]
# SIMD kernels in epic-geometry will opt in per-module with #[allow(unsafe_code)].
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

# The readiness-fix M3 face: the i32 geometry core must fail LOUDLY on
# overflow in production builds, not silently wrap (the audit's
# large-coordinate scenario). Debug profiles already check; this makes
# release match. Config-only — the byte faces (SES/manifest on normal
# boards) are unchanged by construction (overflow paths were never
# exercised by any committed golden run); the wall-clock cost is
# measured by the coordinator's release battery, not here.
[profile.release]
overflow-checks = true
